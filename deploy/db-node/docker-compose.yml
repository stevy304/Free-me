# Database node (server 3): PostgreSQL 16 and Redis 7, bound to the private address only.
# Usage: PRIVATE_IP=10.0.1.20 POSTGRES_PASSWORD=... REDIS_PASSWORD=... docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: freeme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: freeme
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=4GB", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_command=/bin/true"]
    ports: ["${PRIVATE_IP:?set PRIVATE_IP}:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U freeme -d freeme"], interval: 10s, retries: 6 }
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["${PRIVATE_IP:?set PRIVATE_IP}:6379:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
