# Application node (servers 1 and 2): the API and the web app, reachable only on the private network.
# Usage: PRIVATE_IP=10.0.1.10 docker compose --env-file api.env up -d
services:
  api:
    image: ${FREEME_API_IMAGE:-freeme/api:latest}
    restart: unless-stopped
    env_file: [api.env]
    ports: ["${PRIVATE_IP:?set PRIVATE_IP}:4000:4000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  web:
    image: ${FREEME_WEB_IMAGE:-freeme/web:latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["${PRIVATE_IP:?set PRIVATE_IP}:3000:3000"]
    depends_on: [api]
    security_opt: ["no-new-privileges:true"]
