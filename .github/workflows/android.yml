name: Android app

# Builds the Free Me Android app (android/, ANDROID.md) and keeps the APK as the run's "free-me-apk" result. On main
# (with FREEME_HOST set) it also publishes it as the release "android-latest", which Free Me's Download button offers
# (/app, the account menu, the You page) unless an administrator uploaded another APK.
#
# Repository settings (Settings → Secrets and variables → Actions):
# - variable FREEME_HOST: the site's address without https:// (for example freeme.rw);
# - secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD: the signing
#   key (ANDROID.md says how to make it). Without them the APK is signed with a throwaway key, for testing only.

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown to people (for example 1.2.0). Empty: 1.0.<run number>.'
        required: false
        default: ''
      host:
        description: 'Site the app opens (for example name-3000.app.github.dev). Empty: the FREEME_HOST variable, else the app asks for the address when first opened. Builds run by hand are published.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # publishing the release on main
    timeout-minutes: 30
    env:
      FREEME_HOST: ${{ inputs.host || vars.FREEME_HOST }}
      VERSION: ${{ inputs.version || format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Site address
        run: |
          # Accept a pasted address: drop https:// and anything after the host.
          FREEME_HOST=$(printf '%s' "$FREEME_HOST" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##')
          echo "FREEME_HOST=$FREEME_HOST" >> "$GITHUB_ENV"
          if [ -z "$FREEME_HOST" ]; then
            echo "::notice::No site address (FREEME_HOST or the run's host): the app asks for the address the first time it opens (testing, such as a Codespace)."
          fi
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/free-me.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/free-me.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key (secret ANDROID_KEYSTORE_BASE64): this APK is signed with a throwaway key. It installs, but a later build will not install over it. See ANDROID.md."
          fi
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PfreemeHost="$FREEME_HOST" -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/free-me-$VERSION.apk"
      - name: Signing fingerprint
        run: |
          # For Administration → Android app → Full screen (Digital Asset Links).
          keytool -printcert -jarfile "$RUNNER_TEMP/free-me-$VERSION.apk" | grep -E "SHA256:" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Version $VERSION for ${FREEME_HOST:-the address given in the app}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: free-me-apk
          path: ${{ runner.temp }}/free-me-${{ env.VERSION }}.apk
          if-no-files-found: error
      - name: Publish
        # Builds started by hand, and main's builds for the real site (FREEME_HOST).
        if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && env.FREEME_HOST != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/free-me-$VERSION.apk" "$RUNNER_TEMP/free-me.apk"
          site=${FREEME_HOST:+"for https://$FREEME_HOST"}; site=${site:-"(asks for the site's address the first time it opens)"}
          notes="Free Me for Android, version $VERSION, $site. Download free-me.apk on an Android phone, open it and tap Install."
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --title "Free Me for Android" --notes "$notes" --latest "$RUNNER_TEMP/free-me.apk"
          else
            gh release upload android-latest "$RUNNER_TEMP/free-me.apk" --clobber
            gh release edit android-latest --notes "$notes"
          fi
          echo "Published: https://github.com/${{ github.repository }}/releases/download/android-latest/free-me.apk" >> "$GITHUB_STEP_SUMMARY"
