name: Verify Free Me

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Pinned: Playwright 1.56 installs its browser on Ubuntu 24.04 (not on 26.04, the current ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://freeme:freeme@localhost:5432/freeme
      SHADOW_DATABASE_URL: postgresql://freeme:freeme@localhost:5432/freeme_shadow
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freeme
          POSTGRES_PASSWORD: freeme
          POSTGRES_DB: freeme
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U freeme -d freeme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: FFmpeg and an S3-compatible test server
        # When Ubuntu's package mirror is unreachable, apt waits ~20 s per package and the job used to sit until its
        # 25-minute limit and show as "cancelled". Short timeouts with retries, and a step limit, make such an outage
        # fail within minutes with a clear message instead; re-run the job once the mirror is back.
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if sudo apt-get update -q $APT && sudo apt-get install -yq $APT ffmpeg; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::Could not install FFmpeg: Ubuntu's package mirror did not answer. Re-run this job later."; exit 1; fi
            echo "apt attempt $attempt failed; trying again in 20 s"; sleep 20
          done
          # Own virtualenv: installing into the system Python upgrades cryptography and breaks its pyOpenSSL.
          python3 -m venv /tmp/moto-venv
          /tmp/moto-venv/bin/pip install --quiet "moto[server]"
          (/tmp/moto-venv/bin/python -m moto.server -p 5055 > /tmp/moto.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5055/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:5055/ > /dev/null || { cat /tmp/moto.log; exit 1; }
      - name: Install (generates the Prisma client and builds the shared package)
        run: npm ci
      - name: Schema is valid and migrations match it
        run: |
          npx prisma validate
          PGPASSWORD=freeme psql -h localhost -U freeme -d freeme -c 'CREATE DATABASE freeme_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Migrate an empty database and seed reference data
        run: npx prisma migrate deploy && npm run db:seed
      - name: Typecheck
        run: npm run lint
      - name: Unit and API tests (PostgreSQL, Redis, FFmpeg, S3 driver)
        run: npm test
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:5055
      - name: Build
        run: npm run build
      - name: End-to-end tests in a browser
        run: |
          export APP_URL=http://localhost:3000 MAIL_TRANSPORT=console SESSION_SECRET=ci-session-secret-0123456789abcdefghij STORAGE_DRIVER=local LOCAL_STORAGE_DIR=/tmp/fm-storage SCRATCH_DIR=/tmp/fm-scratch ADMIN_EMAILS=admin@example.com,live-admin@example.com
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/api && node dist/worker.js > /tmp/worker.log 2>&1 &)
          (cd apps/web && API_INTERNAL_URL=http://127.0.0.1:4000 PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/apps/web/server.js > /tmp/web.log 2>&1 &)
          npx --prefix apps/web playwright install --with-deps chromium
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/api/health > /dev/null && curl -sf http://127.0.0.1:3000/ > /dev/null && break; sleep 1; done
          cd apps/web && E2E_API_LOG=/tmp/api.log npx playwright test
      - name: Server logs on failure
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/worker.log /tmp/web.log || true
