name: Verify Free Me

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://freeme:freeme@localhost:5432/freeme
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freeme
          POSTGRES_PASSWORD: freeme
          POSTGRES_DB: freeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freeme -d freeme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
