plugins {
    id 'com.android.application'
}

/*
 * Free Me for Android (ANDROID.md): the Free Me site in the app's own full-screen window (a WebView), opened from
 * its own icon. Without a site address the app asks for it the first time (testing, such as a Codespace).
 *
 *   ./gradlew assembleRelease -PfreemeHost=freeme.rw -PversionName=1.0.0 -PversionCode=1
 *
 * Signing: the keystore in ANDROID_KEYSTORE_FILE (with ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
 * ANDROID_KEY_PASSWORD). Keep that key: every update must be signed with it, or phones refuse to install it over the
 * old app. Without it the build is signed with the debug key (for testing only).
 */
// No site (empty): the app asks for the address the first time it opens (testing, such as a GitHub Codespace).
def host = (project.findProperty('freemeHost') ?: System.getenv('FREEME_HOST') ?: '').toString().trim()
def appVersionName = (project.findProperty('versionName') ?: '1.0.0').toString()
def appVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def keystore = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'rw.freeme.app'
    compileSdk 35

    defaultConfig {
        applicationId 'rw.freeme.app'
        minSdk 21
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [hostName: host ?: 'freeme.invalid']
        resValue 'string', 'launch_url', host ? "https://${host}/?source=android" : ''
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // None: the app uses Android's own WebView.
}
